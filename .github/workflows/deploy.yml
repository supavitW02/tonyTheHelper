name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a superseded one is cancelled.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Requires the FLY_API_TOKEN repository secret. Create it with:
    #   fly tokens create deploy --app tonythehelper
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
