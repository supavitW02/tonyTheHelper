name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go
    runs-on: ubuntu-latest
    # The store tests run against a real Postgres on purpose: an upsert, a unique
    # constraint and a uuid cast are exactly what a fake would get wrong.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
        working-directory: api
      - run: go test ./... -race
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/tth?sslmode=disable

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      # `npm run build` runs tsc -b first, so this typechecks as well as builds.
      - run: npm run build
        working-directory: web

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
