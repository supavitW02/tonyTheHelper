name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          # No dependencies yet, so there is no go.sum to key a cache on.
          # Turn this back on when the first module is added.
          cache: false
      - run: go vet ./...
        working-directory: api
      - run: go test ./... -race
        working-directory: api

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      # `npm run build` runs tsc -b first, so this typechecks as well as builds.
      - run: npm run build
        working-directory: web

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
