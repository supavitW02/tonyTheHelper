<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>ของใช้ในบ้าน</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts and replaces it. Without this there is a blank white
           gap while the bundle downloads — on a cold machine that is the first thing the
           user sees, and blank reads as "the app is broken" rather than "it is loading".
           Inline styles on purpose: this must not wait for the stylesheet. -->
      <p
        style="
          margin: 0;
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #475569;
          font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
        "
      >
        กำลังเปิดของใช้ในบ้าน…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
